name: Build Speedster (rootless)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          curl -fsSL -o /tmp/ldid https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64
          chmod +x /tmp/ldid
          sudo mv /tmp/ldid /usr/local/bin/ldid

      - name: Setup Theos
        run: |
          sudo apt-get install -y rsync
          git clone --recursive --depth=1 https://github.com/theos/theos.git $HOME/theos
          git clone --depth=1 https://github.com/theos/sdks.git $HOME/sdks
          mv $HOME/sdks/iPhoneOS13.7.sdk $HOME/theos/sdks/
          curl -fsSL -o /tmp/toolchain.tar.lzma https://github.com/sbingner/llvm-project/releases/latest/download/linux-ios-arm64e-clang-toolchain.tar.lzma
          TMP=$(mktemp -d)
          tar --lzma -xf /tmp/toolchain.tar.lzma -C $TMP
          mkdir -p $HOME/theos/toolchain/linux/iphone
          mv $TMP/ios-arm64e-clang-toolchain/* $HOME/theos/toolchain/linux/iphone/
          test -f $HOME/theos/toolchain/linux/iphone/bin/clang
          chmod +x $HOME/theos/bin/* 2>/dev/null || true
          echo "$HOME/theos/bin" >> $GITHUB_PATH
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Build package (rootless)
        run: make package -C Speedster THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1

      - name: Upload .deb package
        uses: actions/upload-artifact@v4
        with:
          name: Speedster-rootless-deb
          path: Speedster/packages/*.deb
          if-no-files-found: error
