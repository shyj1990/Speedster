name: Build Speedster (roothide)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Iron rules check (pre-build)
        run: python3 tools/check_rules.py Speedster/Speedster.x

      - name: Install Theos (roothide)
        run: |
          git clone --recursive https://github.com/roothide/theos.git $HOME/theos
          brew install ldid xz

      - name: Install iOS 13.7 SDK
        run: |
          curl -fsSL -o /tmp/sdks.zip https://github.com/theos/sdks/archive/refs/heads/master.zip
          unzip -q /tmp/sdks.zip -d /tmp/sdks
          mv /tmp/sdks/sdks-master/iPhoneOS13.7.sdk $HOME/theos/sdks/

      - name: Build package (roothide)
        run: |
          export THEOS=$HOME/theos
          make package -C Speedster THEOS_PACKAGE_SCHEME=roothide FINALPACKAGE=1

      - name: Verify Mach-O outputs
        run: |
          python3 - << 'EOF'
          import struct, sys, glob, os

          ARCH = {0x0100000C: 'arm64', 0x0000000C: 'arm'}
          def arch_name(cputype, cpusub):
              if cputype == 0x0100000C:
                  # arm64e shares arm64's cputype; distinguished by cpusubtype
                  # (0x80000002 = CPU_SUBTYPE_ARM64E with ABI v2 flag)
                  if cpusub & 0x80000000 or (cpusub & 0xFF) == 2:
                      return 'arm64e'
                  return 'arm64'
              return hex(cputype)

          def analyze_thin(name, blob):
              ncmds, sizeofcmds = struct.unpack('<II', blob[16:24])
              off, end = 32, 32 + sizeofcmds
              while off + 8 <= end:
                  cmd, csize = struct.unpack('<II', blob[off:off+8])
                  if csize < 8 or off + csize > end:
                      return f'{name}: CORRUPT load commands'
                  off += csize
              ct, csub = struct.unpack('<II', blob[4:12])
              return f'{name}: [{arch_name(ct, csub)}] load commands OK'

          def analyze(name, blob):
              magic = blob[:4]
              if magic == b'\xca\xfe\xba\xbe':
                  nfat, = struct.unpack('>I', blob[4:8])
                  outs = [f'{name}: FAT ({nfat} slices)']
                  for i in range(nfat):
                      ct, csub, foff, fsize, align = struct.unpack('>IIIII', blob[8+20*i:28+20*i])
                      outs.append(analyze_thin(f'{name} slice{i} [{arch_name(ct, csub)}]', blob[foff:foff+fsize]))
                  return outs
              if magic in (b'\xcf\xfa\xed\xfe', b'\xfe\xed\xfa\xcf'):
                  return [analyze_thin(name, blob)]
              return [f'{name}: not a mach-o (magic {magic.hex()}), skipped']

          targets = [t for t in set(
              glob.glob('Speedster/.theos/obj/**/*.dylib', recursive=True) +
              glob.glob('Speedster/.theos/obj/**/*.bundle/*', recursive=True)
          ) if os.path.isfile(t)]
          results = []
          for t in sorted(targets):
              results += analyze(t, open(t, 'rb').read())
          for r in results:
              print(r)
          if any('CORRUPT' in r for r in results):
              sys.exit('mach-o verification FAILED')
          if not any('slice1 [arm64e]' in r for r in results):
              sys.exit('no arm64e slice produced')
          print('all mach-o outputs verified')
          EOF

      - name: Verify package contents
        run: |
          python3 - << 'EOF'
          import lzma, tarfile, io, struct, re, glob, sys

          debs = glob.glob('Speedster/packages/*.deb')
          if len(debs) != 1:
              sys.exit(f'expected exactly 1 deb, found {len(debs)}')
          data = open(debs[0], 'rb').read()
          assert data[:8] == b'!<arch>\n', 'not a deb'

          members, pos = {}, 8
          while pos < len(data):
              hdr = data[pos:pos+60]
              if len(hdr) < 60: break
              name = hdr[:16].decode().strip()
              size = int(hdr[48:58].decode().strip())
              members[name] = data[pos+60:pos+60+size]
              pos += 60 + size + (size & 1)

          raw = lzma.decompress(members['data.tar.lzma'])
          tf = tarfile.open(fileobj=io.BytesIO(raw))
          names = tf.getnames()
          dylib = [n for n in names if n.endswith('Speedster.dylib')]
          if not dylib:
              sys.exit('no Speedster.dylib in package')
          dy = tf.extractfile(dylib[0]).read()

          fat = dy[:4] == b'\xca\xfe\xba\xbe'
          slices = []
          if fat:
              for i in range(struct.unpack('>I', dy[4:8])[0]):
                  ct, csub = struct.unpack('>II', dy[8+20*i:16+20*i])
                  slices.append((ct, csub))
          arm64  = any(c == 0x0100000C and (s & 0x00FFFFFF) != 2 for c, s in slices)
          arm64e = any(c == 0x0100000C and (s & 0x00FFFFFF) == 2 for c, s in slices)
          if not (fat and arm64 and arm64e):
              sys.exit('FAT must contain arm64 + arm64e slices')

          # control file lives in control.tar (lzma or gz), not data.tar.lzma
          ctrl = ''
          for mname in ('control.tar.lzma', 'control.tar.gz', 'control.tar'):
              if mname in members:
                  raw = members[mname]
                  if mname.endswith('.lzma'):
                      raw = lzma.decompress(raw)
                  elif mname.endswith('.gz'):
                      import gzip
                      raw = gzip.decompress(raw)
                  ct = tarfile.open(fileobj=io.BytesIO(raw))
                  ctrl_members = [n for n in ct.getnames() if n.endswith('./control') or n.endswith('/control') or n == 'control']
                  if ctrl_members:
                      ctrl = ct.extractfile(ctrl_members[0]).read().decode()
                  ct.close()
                  if ctrl: break
          if not ctrl:
              sys.exit('no control file found in control.tar')
          m = re.search(r'^Version:\s*(\S+)', ctrl, re.M)
          version = m.group(1)
          fm = re.search(r'((?:Fresh|Fluid)(?:-\d+)?)', version)
          if not fm:
              sys.exit(f'control version has no Fresh/Fluid tag: {version}')
          tag = fm.group(1).encode()
          checks = {
              'dylib announces version': tag + b' loaded in SpringBoard' in dy or tag + b' injected into app process' in dy,
              'selfcheck line present': b'[selfcheck]' in dy,
              'folder SPRING trace present': b'SPRING k ' in dy,
              'no in-app animation hooks': b'[app-timed]' not in dy,
          }
          ok = True
          for k, v in checks.items():
              print(('PASS ' if v else 'FAIL ') + k)
              ok = ok and v
          print(f'package: {debs[0]} version {version}')
          if not ok:
              sys.exit('package verification FAILED')
          print('package verification OK')
          EOF

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: Speedster-roothide-deb
          path: Speedster/packages/*.deb
          if-no-files-found: error
